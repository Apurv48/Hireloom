<!-- Paste this into Supabase: Authentication > Email Templates > "Reset Password".
     Subject: Your Hireloom password reset code
     The {{ .Token }} placeholder is the one-time code the user types into Hireloom.
     Do not add {{ .ConfirmationURL }}: Hireloom uses a code, not a link. -->
<h2>Reset your Hireloom password</h2>
<p>Use this code to confirm it is you:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px;margin:16px 0;">{{ .Token }}</p>
<p>Enter it on the Hireloom page that asked for it. The code works once and expires soon.</p>
<p>If you did not ask to reset your password, ignore this email. Your password has not changed.</p>
